{{- include "paindash.validate" . }}
{{- $classes := list }}
{{- range $class, $level := .Values.exposure.ingressClasses }}
{{- $classes = append $classes (printf "%s=%s" $class $level) }}
{{- end }}
{{- /* Set only when non-empty, so the binary's defaults apply. */}}
{{- $config := dict
  "PAINDASH_PROMETHEUS_URL" .Values.prometheus.url
  "PAINDASH_ENV_LABEL" .Values.prometheus.envLabel
  "PAINDASH_CLUSTER_LABEL" .Values.prometheus.clusterLabel
  "PAINDASH_DEFAULT_ENV" .Values.prometheus.defaultEnv
  "PAINDASH_DEFAULT_CLUSTER" .Values.prometheus.defaultCluster
  "PAINDASH_ENVS" (join "," .Values.envs)
  "PAINDASH_PROMOTION" (join "," .Values.promotion)
  "PAINDASH_PUBLIC_ENTRYPOINTS" (join "," .Values.exposure.publicEntrypoints)
  "PAINDASH_INGRESS_CLASSES" (join "," $classes)
  "PAINDASH_AUTH" .Values.auth.mode
  "PAINDASH_POMERIUM_JWKS_URL" .Values.auth.pomerium.jwksUrl
  "PAINDASH_POMERIUM_AUDIENCE" .Values.auth.pomerium.audience
  "PAINDASH_POMERIUM_ISSUER" .Values.auth.pomerium.issuer
  "PAINDASH_ALLOWED_GROUPS" (join "," .Values.auth.allowedGroups)
  "PAINDASH_ECR_REGISTRIES" (join "," .Values.registry.ecrRegistries)
  "PAINDASH_SCAN_CONCURRENCY" .Values.scanner.concurrency
  "PAINDASH_GRYPE_DB_URL" .Values.scanner.grypeDbUrl
  "PAINDASH_ENRICH" (ternary "" "off" .Values.enrichment.enabled)
  "PAINDASH_GITHUB_OWNERS" (join "," .Values.fixPrompt.githubOwners)
  "PAINDASH_GITOPS_REPO" .Values.fixPrompt.gitopsRepo
  "PAINDASH_RETENTION" .Values.retention
  "PAINDASH_DB_MAX_CONNS" .Values.database.maxConns
  "PAINDASH_DEMO" (ternary "1" "" .Values.demo.enabled)
}}
{{- $dbSecret := include "paindash.databaseSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paindash.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paindash.labels" . | nindent 4 }}
spec:
  # One pod: it runs the single scan pipeline and holds a ReadWriteOnce cache.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paindash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paindash.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (and .Values.database.url (not .Values.database.existingSecret)) }}
      annotations:
        {{- if and .Values.database.url (not .Values.database.existingSecret) }}
        checksum/database: {{ .Values.database.url | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "paindash.serviceAccountName" . }}
      # No Kubernetes API access: the inventory comes from Prometheus.
      automountServiceAccountToken: false
      # Keeps Service variables out of the PAINDASH_ namespace.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: paindash
        image: {{ include "paindash.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        {{- if $dbSecret }}
        - name: PAINDASH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ $dbSecret }}
              key: {{ include "paindash.databaseSecretKey" . }}
        {{- end }}
        {{- range $name, $value := $config }}
        {{- if $value }}
        - name: {{ $name }}
          value: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.registry.pullSecret }}
        - name: PAINDASH_PULL_SECRET
          value: /etc/paindash/pull/.dockerconfigjson
        {{- end }}
        {{- if .Values.registry.ecrRegistries }}
        # The ECR credential helper must not cache tokens on the read-only root filesystem.
        - name: AWS_ECR_DISABLE_CACHE
          value: "true"
        {{- end }}
        # syft unpacks image layers under TMPDIR; tools writing under HOME get the same volume.
        - name: TMPDIR
          value: /scratch
        - name: HOME
          value: /scratch
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          # /readyz waits up to 3 s for a pooled database connection.
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 20
          timeoutSeconds: 5
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: scratch
          mountPath: /scratch
        # The image sets GRYPE_DB_CACHE_DIR=/var/cache/paindash/grype.
        - name: cache
          mountPath: /var/cache/paindash
        {{- if .Values.registry.pullSecret }}
        - name: pull-secret
          mountPath: /etc/paindash/pull
          readOnly: true
        {{- end }}
      volumes:
      - name: scratch
        emptyDir:
          sizeLimit: {{ .Values.scratch.sizeLimit }}
      - name: cache
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default (printf "%s-cache" (include "paindash.fullname" .)) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.registry.pullSecret }}
      - name: pull-secret
        secret:
          secretName: {{ .Values.registry.pullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
