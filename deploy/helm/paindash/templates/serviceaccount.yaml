{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paindash.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paindash.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# paindash never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
