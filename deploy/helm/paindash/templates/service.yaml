apiVersion: v1
kind: Service
metadata:
  name: {{ include "paindash.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paindash.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "paindash.selectorLabels" . | nindent 4 }}
  ports:
  # UI and API, behind the authenticating proxy.
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  # /metrics, /healthz and /readyz: never route it through the proxy.
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
