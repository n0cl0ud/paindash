<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{{.Title}} · paindash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Crect x='7' y='18' width='4' height='7' rx='1.5' fill='%23637482'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1.5' fill='%23f19773'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1.5' fill='%23e5484d'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --line: #e1e0d9; --line-strong: #c3c2b7;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6e69; --accent-fill: #2a78d6; --bad-text: #b42d2d;
  --sev-low: #556574; --sev-high: #dc855d; --sev-critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --line: #2c2c2a; --line-strong: #383835;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9e9c95; --accent-fill: #3987e5; --bad-text: #f07070;
    --sev-low: #637482; --sev-high: #f19773; --sev-critical: #e5484d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { width: 100%; max-width: 380px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 18px; font-weight: 600; }
.brand svg { width: 28px; height: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
p { margin: 0 0 16px; color: var(--ink-2); }
.error { color: var(--bad-text); font-weight: 500; }
label { display: block; margin-bottom: 14px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
input {
  display: block; width: 100%; margin-top: 6px; padding: 8px 11px; color: var(--ink);
  font-family: inherit; font-size: 16px; /* below 16px, iOS zooms in on focus */
  background: var(--page); border: 1px solid var(--line-strong); border-radius: 8px;
}
input:focus { outline: 2px solid var(--accent-fill); outline-offset: 1px; border-color: transparent; }
.button {
  display: inline-block; width: 100%; padding: 10px 14px; margin-top: 4px; font: inherit; font-weight: 600;
  text-align: center; text-decoration: none; color: var(--page); background: var(--ink);
  border: 0; border-radius: 8px; cursor: pointer;
}
.button:hover { opacity: .88; }
.button:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" style="fill: var(--ink)"/><rect x="7" y="18" width="4" height="7" rx="1.5" style="fill: var(--sev-low)"/><rect x="14" y="12" width="4" height="13" rx="1.5" style="fill: var(--sev-high)"/><rect x="21" y="7" width="4" height="18" rx="1.5" style="fill: var(--sev-critical)"/></svg>
    paindash
  </div>
  <div class="card">
    <h1>{{.Title}}</h1>
    {{if .Message}}<p>{{.Message}}</p>{{end}}
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    {{if .Form}}
    <form method="post" action="/auth/login">
      <input type="hidden" name="rd" value="{{.RD}}">
      <label>Email or username
        <input name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required{{if not .Email}} autofocus{{end}} value="{{.Email}}">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required{{if .Email}} autofocus{{end}}>
      </label>
      <button class="button" type="submit">Sign in</button>
    </form>
    {{end}}
    {{if .Link}}<a class="button" href="{{.Link}}">{{.LinkText}}</a>{{end}}
  </div>
</main>
</body>
</html>
