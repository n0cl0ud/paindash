# Dependabot: Go modules, npm (web/), GitHub Actions, Docker base image tags.
# Monday 05:00 Europe/Paris. Minor and patch bumps are grouped per ecosystem;
# every PR goes through pr-verify.yml and is merged by a human.
# Docker digest pins are not tracked by Dependabot: see audit-docker-digests.yml.
version: 2
updates:

- package-ecosystem: gomod
  directories: [/, /tools/syft, /tools/grype]
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels: [dependencies]
  commit-message:
    prefix: "chore(deps)"
  groups:
    go-deps:
      patterns: ["*"]
      update-types: ["minor", "patch"]

- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels: [dependencies]
  commit-message:
    prefix: "chore(deps)"
  groups:
    web-deps:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  # Follows the Node major of the build image, moved by hand to the next LTS.
  ignore:
    - dependency-name: "@types/node"
      update-types: ["version-update:semver-major"]

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels: [dependencies, ci]
  commit-message:
    prefix: "chore(ci)"

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels: [dependencies, docker]
  commit-message:
    prefix: "chore(docker)"
  # Node majors alternate LTS / short-lived: moved by hand to the next LTS.
  ignore:
    - dependency-name: "node"
      update-types: ["version-update:semver-major"]
